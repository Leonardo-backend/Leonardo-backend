<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Leonardo Cesar — Desenvolvedor Back-end Júnior">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#C7D2FE"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="20" fill="none" stroke="#E0E7FF"/>
  <rect x="760" y="30" width="400" height="240" fill="url(#dots)" opacity="0.8"/>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="72" y="78" width="56" height="6" rx="3" fill="url(#accent)"/>
    <text x="70" y="150" font-size="60" font-weight="700" fill="#0F172A">Leonardo Cesar</text>
    <text x="72" y="196" font-size="28" font-weight="500" fill="#4F46E5">Desenvolvedor Back-end Júnior</text>
    <text x="72" y="236" font-size="20" fill="#64748B">Node.js  ·  TypeScript  ·  PostgreSQL</text>
  </g>

  <g transform="translate(820 70)" font-family="Consolas, 'Courier New', monospace" font-size="19">
    <rect width="300" height="160" rx="14" fill="#FFFFFF" stroke="#E0E7FF"/>
    <circle cx="24" cy="24" r="6" fill="#FCA5A5"/>
    <circle cx="44" cy="24" r="6" fill="#FCD34D"/>
    <circle cx="64" cy="24" r="6" fill="#86EFAC"/>
    <text x="24" y="70" fill="#64748B">POST <tspan fill="#0F172A">/appointments</tspan></text>
    <text x="24" y="104" fill="#16A34A">201 <tspan fill="#64748B">Created</tspan></text>
    <text x="24" y="138" fill="#4F46E5">{ "status": "ok" }</text>
  </g>
</svg>
